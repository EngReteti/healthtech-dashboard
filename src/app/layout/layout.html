<div class="min-h-screen bg-gray-50">

  <header class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-gray-200 flex items-center px-6 z-20">
    <div class="bg-teal-100 rounded-full p-2 mr-3 flex-shrink-0">
      <!-- A real medical cross/plus sign, built from two simple 
           rectangles - this is the universal hospital symbol, and 
           since it's just two rects (no curves), it's guaranteed 
           to render exactly as intended -->
      <svg class="w-5 h-5 text-teal-600" viewBox="0 0 24 24" fill="currentColor">
        <rect x="9" y="2" width="6" height="20" rx="1.5" />
        <rect x="2" y="9" width="20" height="6" rx="1.5" />
      </svg>
    </div>
    <div class="leading-tight">
      <h1 class="text-lg font-bold text-gray-800">Hospital Inventory System</h1>
      <p class="text-xs text-gray-400">Medical Supply Management</p>
    </div>
  </header>

  <app-sidebar></app-sidebar>

  <main class="ml-64 pt-16">
    <router-outlet></router-outlet>
  </main>
</div>
