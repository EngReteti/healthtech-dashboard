<aside class="w-64 bg-white border-r border-gray-200 flex flex-col fixed left-0 top-16 h-[calc(100dvh-4rem)] overflow-y-auto">

  <nav class="flex-1 px-3 py-4 space-y-1">
    <a routerLink="/dashboard" routerLinkActive="bg-teal-50 text-teal-700 font-semibold"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      Dashboard
    </a>

    <a routerLink="/stock-movement" routerLinkActive="bg-teal-50 text-teal-700 font-semibold"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      Record Movement
    </a>

    <a routerLink="/movement-history" routerLinkActive="bg-teal-50 text-teal-700 font-semibold"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      History
    </a>

    <a routerLink="/approvals" routerLinkActive="bg-teal-50 text-teal-700 font-semibold"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Approvals
    </a>
  </nav>

  <div class="px-4 py-4 border-t border-gray-100 flex-shrink-0">
    <div class="bg-gray-100 text-gray-600 text-xs px-3 py-1.5 rounded-full text-center mb-3">
      {{ userRole() }}
    </div>
    <button (click)="logout()"
            class="w-full text-red-600 hover:bg-red-50 text-sm font-medium py-2 rounded-lg border border-red-100">
      Log Out
    </button>
  </div>
</aside>
