<app-navbar></app-navbar>

<div class="min-h-screen bg-gray-50 p-6 flex justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-lg">

    <h1 class="text-2xl font-bold text-gray-800 mb-1">Record Stock Movement</h1>
    <p class="text-gray-500 mb-6">Log stock coming in, going out, or being adjusted</p>

    <form (ngSubmit)="onSubmit()">

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Product</label>
        <select [(ngModel)]="selectedProductId" name="product" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
          <option [value]="null" disabled>Select a product</option>
          @for (product of products(); track product.id) {
            <option [value]="product.id">{{ product.name }} ({{ product.sku }})</option>
          }
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Movement Type</label>
        <select [(ngModel)]="selectedType" name="type" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
          @for (type of movementTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
        <input type="number" [(ngModel)]="quantity" name="quantity" min="1" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Reason</label>
        <input type="text" [(ngModel)]="reason" name="reason" required
               placeholder="e.g. Delivery from supplier, Dispensed to ICU"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" />
      </div>

      @if (successMessage()) {
        <p class="text-green-600 text-sm mb-4 bg-green-50 p-3 rounded-lg">{{ successMessage() }}</p>
      }

      @if (errorMessage()) {
        <p class="text-red-600 text-sm mb-4 bg-red-50 p-3 rounded-lg">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="submitting()"
              class="w-full bg-teal-600 text-white py-2 rounded-lg font-semibold hover:bg-teal-700 transition-colors disabled:opacity-50">
        {{ submitting() ? 'Recording...' : 'Record Movement' }}
      </button>
    </form>
  </div>
</div>
